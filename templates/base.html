<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom styles -->
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" />

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-light">

  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
        <i class="bi bi-tree-fill fs-4"></i>
        <span>{{ agent_name }}</span>
        <span class="badge bg-light text-success ms-1 small">AI</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
              <i class="bi bi-chat-dots me-1"></i>Chat
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
              <i class="bi bi-grid me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/profile' %}active{% endif %}" href="/profile">
              <i class="bi bi-person-circle me-1"></i>Profile
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/agent-settings' %}active{% endif %}" href="/agent-settings">
              <i class="bi bi-gear me-1"></i>Agent
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Main content ===== -->
  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <!-- ===== Footer ===== -->
  <footer class="text-center text-muted py-3 small border-top mt-4">
    <span>{{ app_name }} &bull; Powered by <strong>IBM watsonx.ai</strong> &amp; Granite &bull; &copy; 2025</span>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Marked (markdown renderer) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <!-- Main JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
